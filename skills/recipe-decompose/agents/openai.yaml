interface:
  display_name: "Task Decompose"
  short_description: "Decompose requirements into Linear-ready tasks with dependency graphs"

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "linear"
      description: "Linear project management for issue fetching, creation, and dependency management"
      transport: "streamable_http"
      url: "https://mcp.linear.app/mcp"
      required: true
